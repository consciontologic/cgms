worker_processes 1;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  types { font/ttf ttf; }
  access_log off;
  error_log /dev/stderr crit;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  resolver 127.0.0.11 valid=5s ipv6=off;
  server {
    set $backend backend:8080;
    listen 8443 ssl;
    ssl_certificate /run/secrets/tls_certificate;
    ssl_certificate_key /run/secrets/tls_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_name _;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    location /internal/ { return 404; }
    location /health/ { proxy_pass http://$backend; }
    location /v1/ {
      proxy_pass http://$backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 70s;
      proxy_buffering off;
    }
    location ~ \.map$ { return 404; }
    location / { expires -1; try_files $uri $uri/ /index.html; }
  }
}
