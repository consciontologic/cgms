services:
  web:
    ports: !override ['127.0.0.1:8443:8443']
    volumes:
      - ../../config/nginx/production.conf:/etc/nginx/nginx.conf:ro
    secrets: [tls_certificate, tls_key]
    healthcheck:
      test: [CMD-SHELL, 'wget -q --no-check-certificate -O /dev/null https://127.0.0.1:8443/health/ready']
secrets:
  tls_certificate:
    file: ../../.local/secrets/tls_certificate
  tls_key:
    file: ../../.local/secrets/tls_key
